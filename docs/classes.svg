<text x="817" y="930" class="small" text-anchor="start">+ participantes: Map&lt;Long, BigDecimal&gt;</text>
<text x="40" y="1040" class="small" text-anchor="start">Associações usam IDs: administrador, autor, pagador, recebedor e participantes referenciam Morador.</text>
<text x="40" y="1067" class="small" text-anchor="start">Parcela é um valor de Despesa.parcelas, persistido em despesa_parcelas. * significa zero ou muitos.</text>
<text x="40" y="1094" class="small" text-anchor="start">As classes guardam dados; as regras ficam em AuthService, RepublicaService e DivisaoService.</text>
<text x="40" y="1121" class="small" text-anchor="start">Uma Recorrencia gera várias despesas; excluir o modelo preserva as despesas e seu modeloId histórico.</text>
